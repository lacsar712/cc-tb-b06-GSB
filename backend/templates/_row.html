<tr>
  <td>{{ row.lot }}</td>
  <td>{{ row.score }}</td>
  <td class="{% if row.verdict == '通过' %}pass{% else %}fail{% endif %}">{{ row.verdict }}</td>
  <td>
    {% if row.liquor_summary %}
      <a href="{{ url_for('snapshots_page', cupping=row.id) }}">{{ row.liquor_summary }}</a>
    {% else %}—{% endif %}
  </td>
  <td>{{ row.note }}</td>
</tr>
